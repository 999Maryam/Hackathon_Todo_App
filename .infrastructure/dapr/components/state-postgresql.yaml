apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore-postgresql
  namespace: default
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    value: "host=postgres port=5432 user=postgres password=postgres database=todoapp"
  - name: actorStateStore
    value: "true"
  - name: concurrency
    value: "first-write"