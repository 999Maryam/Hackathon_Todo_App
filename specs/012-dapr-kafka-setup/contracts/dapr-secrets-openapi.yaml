openapi: 3.0.1
info:
  title: Dapr Secrets API for Todo App
  description: API contracts for accessing secrets via Dapr secret store building block
  version: 1.0.0
servers:
  - url: http://localhost:3500
    description: Dapr sidecar endpoint
paths:
  /v1.0/secrets/secretstore-kubernetes/{key}:
    get:
      summary: Get secret value by key
      description: Retrieves a secret value from the Kubernetes secret store using Dapr
      parameters:
        - name: key
          in: path
          required: true
          description: The key for the secret value (e.g., OPENROUTER_API_KEY)
          schema:
            type: string
      responses:
        '200':
          description: Secret value retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretResponse'
        '404':
          description: Secret not found
        '500':
          description: Internal server error
  /v1.0/secrets/secretstore-kubernetes/bulk:
    get:
      summary: Get all secrets
      description: Retrieves all secret values from the Kubernetes secret store
      responses:
        '200':
          description: All secrets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSecretResponse'
        '500':
          description: Internal server error
components:
  schemas:
    SecretResponse:
      type: object
      additionalProperties:
        type: string
      description: Map of secret keys to their values
      example:
        OPENROUTER_API_KEY: "sk-1234567890abcdef"
    BulkSecretResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/SecretResponse'
      description: Map of secret store names to their secret values
      example:
        secretstore-kubernetes:
          OPENROUTER_API_KEY: "sk-1234567890abcdef"