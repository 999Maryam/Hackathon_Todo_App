openapi: 3.0.3
info:
  title: Todo App Tags API - Phase V
  description: Tag management endpoints for task categorization
  version: 5.0.0

paths:
  /api/{user_id}/tags:
    get:
      summary: List all tags for the user
      description: Returns all tags with task counts
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagWithCount'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new tag
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Tag name already exists for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Tag 'Work' already exists"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/{user_id}/tags/{tag_id}:
    get:
      summary: Get a single tag with its tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: tag_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWithTasks'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update tag name
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: tag_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdate'
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Tag name already exists
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete a tag
      description: Removes the tag and all task associations
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: tag_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Tag deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - created_at

    TagCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Tag name (must be unique per user)
      required:
        - name

    TagUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
        - name

    TagWithCount:
      allOf:
        - $ref: '#/components/schemas/Tag'
        - type: object
          properties:
            task_count:
              type: integer
              description: Number of tasks using this tag

    TagWithTasks:
      allOf:
        - $ref: '#/components/schemas/Tag'
        - type: object
          properties:
            tasks:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  completed:
                    type: boolean
                  priority:
                    type: string

  responses:
    Unauthorized:
      description: Invalid or missing authentication token
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Invalid authentication credentials"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Tag not found"
