# ========================================
# Docker Compose Configuration
# Phase IV Todo Chatbot - Local Development
# ========================================
# Task: T011-T014 | Spec: 008-docker-containerization
#
# This file orchestrates the multi-container application:
# - Backend (FastAPI) on port 8000
# - Frontend (Next.js) on port 3000
#
# Services communicate via default bridge network using service names.
# Backend health check ensures frontend waits for API readiness.
# ========================================

services:
  # ========================================
  # Backend Service (FastAPI)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount .env file to support runtime environment updates
      - ./backend/.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - todo-network

  # ========================================
  # Frontend Service (Next.js)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # Override API URL to use internal service name
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo-network

  # ========================================
  # Development Services (with hot-reload)
  # ========================================
  # Task: T019-T021 | Spec: 008-docker-containerization
  # Start with: docker-compose --profile dev up

  backend-dev:
    profiles:
      - dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount source code for hot-reload
      - ./backend/app:/app/app:ro
      - ./backend/.env:/app/.env:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - todo-network

  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      target: builder
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    volumes:
      # Mount source code for hot-reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    environment:
      NEXT_PUBLIC_API_URL: http://backend-dev:8000
    command: ["npm", "run", "dev"]
    depends_on:
      backend-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo-network

# ========================================
# Networks
# ========================================
networks:
  todo-network:
    driver: bridge
